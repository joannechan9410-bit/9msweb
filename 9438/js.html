<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER・MART 炫彩未來購物網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cyber: ['Orbitron', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            neonCyan: '#00f3ff',
            neonPink: '#ff007f',
            neonPurple: '#a855f7',
            cyberDark: '#080c16',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --cyan: #00f3ff;
      --pink: #ff007f;
      --purple: #8b5cf6;
      --dark-card: rgba(13, 19, 36, 0.7);
    }

    body {
      background: radial-gradient(circle at 10% 10%, #15112e 0%, #070a13 50%, #030509 100%);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Ambient Glowing Orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(130px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      animation: floatGlow 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -100px; left: -100px; }
    .orb-2 { width: 450px; height: 450px; background: #ff007f; bottom: 50px; right: -100px; animation-delay: -5s; }
    .orb-3 { width: 400px; height: 400px; background: #00f3ff; top: 40%; left: 45%; opacity: 0.2; animation-delay: -8s; }

    @keyframes floatGlow {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(60px) scale(1.15); }
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: var(--dark-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      transform: translateY(-8px);
      border-color: rgba(0, 243, 255, 0.45);
      box-shadow: 0 16px 36px -10px rgba(0, 243, 255, 0.2), 0 0 25px rgba(255, 0, 127, 0.15);
    }

    /* Cyber Button with Shimmer & Ripple */
    .btn-cyber {
      position: relative;
      background: linear-gradient(135deg, #00f3ff 0%, #7928ca 50%, #ff007f 100%);
      background-size: 200% auto;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 243, 255, 0.25);
      overflow: hidden;
    }
    .btn-cyber:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.45);
    }
    .btn-cyber:active {
      transform: scale(0.96);
    }
    .btn-cyber::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 35%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: rotate(30deg);
      transition: 0.6s ease;
    }
    .btn-cyber:hover::after {
      left: 130%;
    }

    /* Button Ripple on Click */
    .ripple-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Cart Jelly Bounce Animation */
    .cart-bounce {
      animation: jelly 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes jelly {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.35, 0.8); }
      40% { transform: scale(0.85, 1.25); }
      55% { transform: scale(1.15, 0.9); }
      70% { transform: scale(0.95, 1.05); }
      100% { transform: scale(1, 1); }
    }

    /* Flying Projectile Glow Object */
    .flying-bullet {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 10%, #00f3ff 60%, #ff007f 100%);
      box-shadow: 0 0 20px #00f3ff, 0 0 35px #ff007f;
      transform: translate(-50%, -50%);
    }

    /* Overlay Canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(8, 12, 22, 0.8); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }
  </style>
</head>
<body class="relative">

  <!-- Ambient Color Layers -->
  <div class="ambient-orb orb-1"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-10 pb-24 relative z-10">
    <!-- Hero Title -->
    <div class="text-center max-w-3xl mx-auto mb-14">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-cyan-400/30 bg-cyan-500/10 text-cyan-300 text-xs font-bold uppercase tracking-wider mb-4 shadow-[0_0_15px_rgba(0,243,255,0.2)]">

      <h1 class="text-3xl sm:text-5xl font-black font-cyber tracking-tight mb-4 text-white">

      <p class="text-slate-400 text-base sm:text-lg">
        享受極致流暢的 Canvas 粒子禮花、拋物線光球飛射軌跡、音效合成與購物車果凍彈跳體驗。

    <!-- Product Grid Container -->

  <!-- Cart Drawer Overlay -->

  <!-- Cart Drawer Sidebar -->
  <aside id="cart-drawer" class="fixed top-0 right-0 w-full max-w-md h-full bg-[#0c1222]/95 border-l border-white/15 shadow-2xl z-50 translate-x-full transition-transform duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col">
    <!-- Drawer Header -->
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <h2 class="font-cyber font-bold text-lg text-white">我的購物裝備庫</h2>
      </div>
      <button id="close-drawer-btn" class="w-9 h-9 rounded-xl border border-white/10 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Drawer Item List -->
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4">
      <!-- Cart Items generated by JS -->
    </div>

    <!-- Drawer Footer -->
    <div class="p-6 border-t border-white/10 bg-[#080d1a]/80 space-y-4">
      <div class="flex items-center justify-between text-slate-400 text-sm">
        <span>配送方式</span>
        <span class="text-cyan-400 font-semibold">次世代極速星際快遞 (免運費)</span>
      </div>
      <div class="flex items-center justify-between text-base">
        <span class="text-white font-bold">訂單總額</span>
        <span id="cart-total-price" class="text-2xl font-black font-cyber text-cyan-400">$0</span>
      </div>
      <button id="checkout-action-btn" class="btn-cyber w-full py-3.5 rounded-xl text-white font-bold text-base flex items-center justify-center gap-2">
        <i class="fa-solid fa-lock text-sm"></i>
        <span>立即確認結帳</span>

    </div>
  </aside>

  <!-- Glassmorphism Toast Floating Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <script>
    // Product Catalog Mock Data
    const products = [
      {
        id: 1,
        title: "全息賽博護目鏡 Cyber Visor",
        tag: "熱銷旗艦",
        desc: "內建抬頭 HUD 顯示螢幕，支援神經網路 AR 視野校正與全景夜視傳感器。",
        price: 5880,
        icon: "fa-vr-cardboard",
        gradient: "from-cyan-500 to-blue-600",
        color: "#00f3ff",

      },
      {
        id: 2,
        title: "霓虹光子機械鍵盤 Neon Mech",
        tag: "電競神物",
        desc: "磁吸光軸自訂驅動，全金屬陽極氧化機身與流光 RGB 沉浸反應燈效。",
        price: 4290,
        icon: "fa-keyboard",
        gradient: "from-pink-500 to-purple-600",
        color: "#ff007f",
        rating: "5.0"
      },
      {
        id: 3,
        title: "超載脈衝能量晶飲 Pulse Energy",
        tag: "生化補給",
        desc: "微膠囊牛磺酸融合微量發光離子，3秒瞬態恢復專注力與極限反應。",
        price: 360,
        icon: "fa-bolt-lightning",
        gradient: "from-amber-400 to-rose-500",
        color: "#f59e0b",
        rating: "4.8"
      },
      {
        id: 4,
        title: "量子共振真無線耳機 Quantum Pro",
        tag: "次世代降噪",
        desc: "微型石墨烯複合振膜，0.01ms 極致無損低延遲空間音效傳輸技術。",
        price: 6490,
        icon: "fa-headphones-simple",
        gradient: "from-emerald-400 to-teal-600",
        color: "#10b981",
        rating: "4.9"
      },
      {
        id: 5,
        title: "光能抗荷武士夾克 Samurai Jacket",
        tag: "潮派限量",
        desc: "智能溫度恆定纖維，具備防割裂抗水層與立領光導纖維動態流水燈。",
        price: 12800,
        icon: "fa-shield-halved",
        gradient: "from-violet-500 to-fuchsia-600",
        color: "#a855f7",
        rating: "4.9"
      },
      {
        id: 6,
        title: "反重力反應爐核心燈 Glow Core",
        tag: "未來家居",
        desc: "磁懸浮聚合物核心，支援手勢空間懸空切換 1600 萬種極光波形色相。",
        price: 3450,
        icon: "fa-circle-nodes",
        gradient: "from-cyan-400 to-indigo-600",
        color: "#38bdf8",
        rating: "4.7"
      }
    ];

    // Shopping Cart State
    let cartItems = [];
    let isSoundEnabled = true;

    // Web Audio Synthesizer (No external MP3 files needed)
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Play Synthesizer Sci-Fi Sound
    function playSciFiChime(type = 'add') {
      if (!isSoundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'add') {
          // Futuristic Arpeggio Laser Chime
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
          osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.16); // D6
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'hit') {
          // Soft bubble cart entry pop
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.21);
        } else if (type === 'checkout') {
          // Fanfare Victory chords
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + idx * 0.08);
            g.gain.setValueAtTime(0.15, now + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.4);
            o.start(now + idx * 0.08);
            o.stop(now + idx * 0.08 + 0.42);
          });
        }
      } catch (e) {
        console.warn('Audio playback inhibited', e);
      }
    }

    // Toggle Sound Button
    const soundBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      if (isSoundEnabled) {
        soundIcon.className = "fa-solid fa-volume-high text-cyan-400";
        playSciFiChime('add');
      } else {
        soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
      }
    });

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class SparkleParticle {
      constructor(x, y, themeColor) {
        this.x = x;
        this.y = y;
        this.color = themeColor || ['#00f3ff', '#ff007f', '#a855f7', '#ffffff', '#fbbf24'][Math.floor(Math.random() * 5)];
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 8 + 3;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.size = Math.random() * 4.5 + 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.015;
        this.gravity = 0.15;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.life -= this.decay;
        this.size = Math.max(0, this.size - 0.04);
      }

      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.life);
        context.fillStyle = this.color;
        context.shadowColor = this.color;
        context.shadowBlur = 16;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function createExplosion(x, y, themeColor, count = 40) {
      for (let i = 0; i < count; i++) {
        particles.push(new SparkleParticle(x, y, themeColor));
      }
    }

    function runFxLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0 || p.size <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(runFxLoop);
    }
    runFxLoop();

    function launchCurvedOrb(startX, startY, targetElem, themeColor, onComplete) {
      const targetRect = targetElem.getBoundingClientRect();
      const endX = targetRect.left + targetRect.width / 2;
      const endY = targetRect.top + targetRect.height / 2;

      // Calculate Quadratic Bezier Control Point (curves upwards)
      const ctrlX = (startX + endX) / 2 + (Math.random() * 80 - 40);
      const ctrlY = Math.min(startX, endY) - (120 + Math.random() * 100);

      const orb = document.createElement('div');
      orb.className = 'flying-bullet';
      orb.style.boxShadow = `0 0 20px ${themeColor}, 0 0 40px #ffffff`;
      document.body.appendChild(orb);

      const duration = 650; // milliseconds
      const startTime = performance.now();

      function animateOrb(time) {
        const elapsed = time - startTime;
        const t = Math.min(1, elapsed / duration);

        // Quadratic Bezier Formula: B(t) = (1-t)^2 * P0 + 2(1-t)t * P1 + t^2 * P2
        const currentX = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * endX;
        const currentY = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * endY;

        orb.style.left = `${currentX}px`;
        orb.style.top = `${currentY}px`;

        // Emit slight spark trail along the projectile trajectory
        if (Math.random() > 0.3) {
          particles.push(new SparkleParticle(currentX, currentY, themeColor));
        }

        if (t < 1) {
          requestAnimationFrame(animateOrb);
        } else {
          orb.remove();
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(animateOrb);
    }

    function triggerCartBadgePop() {
      const cartIcon = document.getElementById('nav-cart-icon');
      const badge = document.getElementById('nav-cart-badge');
      const cartBtn = document.getElementById('cart-toggle-btn');

      cartBtn.classList.remove('cart-bounce');
      void cartBtn.offsetWidth; // Trigger reflow
      cartBtn.classList.add('cart-bounce');

      badge.style.transform = 'scale(1.4)';
      setTimeout(() => {
        badge.style.transform = 'scale(1)';
      }, 250);

      playSciFiChime('hit');
    }

    function spawnToastMessage(product) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-3.5 p-4 rounded-2xl bg-[#0e1628]/95 border border-cyan-400/40 text-white shadow-[0_10px_35px_rgba(0,0,0,0.6),0_0_20px_rgba(0,243,255,0.25)] backdrop-blur-xl translate-x-32 opacity-0 transition-all duration-300 min-w-[280px] max-w-sm';

      toast.innerHTML = `
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${product.gradient} flex items-center justify-center shrink-0 shadow-[0_0_15px_${product.color}]">
          <i class="fa-solid ${product.icon} text-white text-base"></i>
        </div>
        <div class="flex-1">
          <div class="text-[11px] font-bold text-cyan-400 tracking-wider uppercase">已納入戰備庫存！</div>
          <div class="font-bold text-sm text-slate-100 truncate">${product.title}</div>
          <div class="text-xs text-slate-400">$${product.price.toLocaleString()} NTD</div>
        </div>
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
      `;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-32', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-x-32', 'opacity-0');
        setTimeout(() => toast.remove(), 350);
      }, 3200);
    }

    function renderProductCatalog() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = products.map(prod => `
        <div class="glass-card rounded-2xl overflow-hidden flex flex-col group" data-product-id="${prod.id}">
          <!-- Product Visual Preview Area -->
          <div class="relative h-56 bg-gradient-to-b from-white/5 to-transparent flex items-center justify-center p-6 overflow-hidden">
            <span class="absolute top-4 left-4 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase bg-white/10 border border-white/10 text-cyan-300 backdrop-blur-md">
              ${prod.tag}
            </span>
            <span class="absolute top-4 right-4 flex items-center gap-1 text-xs font-semibold text-yellow-400 bg-black/40 px-2.5 py-1 rounded-full border border-yellow-400/20">
              <i class="fa-solid fa-star text-[10px]"></i> ${prod.rating}
            </span>
            <!-- Glowing Icon Representation -->
            <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr ${prod.gradient} flex items-center justify-center shadow-[0_0_35px_${prod.color}66] group-hover:scale-110 group-hover:rotate-6 transition-all duration-500">
              <i class="fa-solid ${prod.icon} text-4xl text-white"></i>
            </div>
          </div>

          <!-- Product Details -->
          <div class="p-6 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-lg text-white mb-2 group-hover:text-cyan-400 transition-colors">${prod.title}</h3>
              <p class="text-slate-400 text-sm line-clamp-2 leading-relaxed mb-4">${prod.desc}</p>
            </div>

            <div>
              <div class="flex items-baseline justify-between mb-4">
                <span class="text-xs uppercase font-bold text-slate-500 tracking-wider">限定價格</span>
                <span class="font-cyber font-black text-2xl text-cyan-400">$${prod.price.toLocaleString()}</span>
              </div>

              <!-- Spectacular Interactive Add-To-Cart Button -->
              <button class="btn-cyber w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2 group/btn" onclick="handleAddToCartClick(event, ${prod.id})">
                <i class="fa-solid fa-plus text-xs group-hover/btn:rotate-90 transition-transform duration-300"></i>
                <span>加入購物車</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.handleAddToCartClick = function(event, productId) {
      const btn = event.currentTarget;
      const rect = btn.getBoundingClientRect();
      const clickX = event.clientX;
      const clickY = event.clientY;

      const product = products.find(p => p.id === productId);
      if (!product) return;

      // 1. Play Synthesizer Sound
      playSciFiChime('add');

      // 2. Button Ripple Effect
      const ripple = document.createElement('span');
      ripple.className = 'ripple-circle';
      const diameter = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${diameter}px`;
      ripple.style.left = `${clickX - rect.left - diameter / 2}px`;
      ripple.style.top = `${clickY - rect.top - diameter / 2}px`;
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // 3. Canvas Sparkle Explosion at Cursor Point
      createExplosion(clickX, clickY, product.color, 45);

      // 4. Curved Projectile Bullet Flying toward Navigation Cart
      const cartIcon = document.getElementById('nav-cart-icon');
      launchCurvedOrb(clickX, clickY, cartIcon, product.color, () => {
        // Upon arrival: trigger jelly bounce & audio pop
        triggerCartBadgePop();
        // Little particle impact around the cart icon
        const iconRect = cartIcon.getBoundingClientRect();
        createExplosion(iconRect.left + iconRect.width / 2, iconRect.top + iconRect.height / 2, product.color, 25);
      });

      // 5. Update State
      const existing = cartItems.find(item => item.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cartItems.push({ ...product, quantity: 1 });
      }
      updateCartDisplay();

      // 6. Floating Glass Toast Alert
      spawnToastMessage(product);
    };

    const drawerOverlay = document.getElementById('cart-drawer-overlay');
    const cartDrawer = document.getElementById('cart-drawer');
    const openDrawerBtn = document.getElementById('cart-toggle-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const checkoutBtn = document.getElementById('checkout-action-btn');

    function toggleCartDrawer(open) {
      if (open) {
        drawerOverlay.classList.remove('pointer-events-none');
        drawerOverlay.classList.add('opacity-100');
        cartDrawer.classList.remove('translate-x-full');
      } else {
        drawerOverlay.classList.add('pointer-events-none');
        drawerOverlay.classList.remove('opacity-100');
        cartDrawer.classList.add('translate-x-full');
      }
    }

    openDrawerBtn.addEventListener('click', () => toggleCartDrawer(true));
    closeDrawerBtn.addEventListener('click', () => toggleCartDrawer(false));
    drawerOverlay.addEventListener('click', () => toggleCartDrawer(false));

    function updateCartDisplay() {
      const badge = document.getElementById('nav-cart-badge');
      const listContainer = document.getElementById('cart-items-container');
      const totalDisplay = document.getElementById('cart-total-price');

      const totalCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      const grandTotal = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);

      badge.textContent = totalCount;
      totalDisplay.textContent = `$${grandTotal.toLocaleString()}`;

      if (cartItems.length === 0) {
        listContainer.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-center text-slate-500">
            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center text-2xl mb-4 text-slate-600">
              <i class="fa-solid fa-box-open"></i>
            </div>
            <p class="font-bold text-slate-300 mb-1">裝備庫目前空無一物</p>
            <p class="text-xs">快前往選購次世代裝備並觸發炫彩特效！</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = cartItems.map(item => `
        <div class="flex items-center gap-3.5 p-3.5 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-400/30 transition-colors">
          <div class="w-12 h-12 rounded-lg bg-gradient-to-tr ${item.gradient} flex items-center justify-center shrink-0 shadow-[0_0_10px_${item.color}55]">
            <i class="fa-solid ${item.icon} text-white text-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="font-semibold text-white text-sm truncate">${item.title}</h4>
            <div class="text-xs font-cyber text-cyan-400 font-bold">$${(item.price * item.quantity).toLocaleString()}</div>
          </div>
          <div class="flex items-center gap-1.5 bg-black/40 rounded-lg p-1 border border-white/10">
            <button class="w-6 h-6 flex items-center justify-center text-xs text-slate-300 hover:text-white rounded hover:bg-white/10" onclick="alterQuantity(${item.id}, -1)">
              <i class="fa-solid fa-minus"></i>
            </button>
            <span class="w-6 text-center text-xs font-bold text-white">${item.quantity}</span>
            <button class="w-6 h-6 flex items-center justify-center text-xs text-slate-300 hover:text-white rounded hover:bg-white/10" onclick="alterQuantity(${item.id}, 1)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    window.alterQuantity = function(id, delta) {
      const index = cartItems.findIndex(i => i.id === id);
      if (index === -1) return;

      cartItems[index].quantity += delta;
      if (cartItems[index].quantity <= 0) {
        cartItems.splice(index, 1);
      }
      updateCartDisplay();
    };

    // Checkout Simulation with Grand Fireworks Display
    checkoutBtn.addEventListener('click', () => {
      if (cartItems.length === 0) {
        alert("購物車內尚無裝備，請先挑選商品！");
        return;
      }

      playSciFiChime('checkout');

      // Trigger Grand Fireworks Confetti across the screen
      for (let burst = 0; burst < 6; burst++) {
        setTimeout(() => {
          createExplosion(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight * 0.7 + 100,
            null,
            50
          );
        }, burst * 160);
      }

      // Close drawer & reset cart
      setTimeout(() => {
        toggleCartDrawer(false);
        cartItems = [];
        updateCartDisplay();
      }, 900);
    });

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      renderProductCatalog();
      updateCartDisplay();
    });
  </script>
</body>
</html>
